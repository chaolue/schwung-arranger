name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' src/module.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != module.json version ($MODULE_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build with Docker
        run: |
          docker build -t module-builder -f scripts/Dockerfile .
          # Invoke via bash so the executable bit on the script isn't required
          # (GitHub checkout doesn't preserve file mode unless committed +x).
          docker run --rm -v "$PWD:/build" -w /build module-builder bash ./scripts/build.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arranger-module.tar.gz
          # A release without its tarball is not a release; v2 would publish
          # one silently if the file were missing.
          fail_on_unmatched_files: true

      # release.json on the default branch is what Schwung Manager reads to
      # offer an update, and by now the release above is public. So a push
      # that fails must say what is out of step and how to fix it -- a red
      # run alone reads as "the release failed" when the release is fine and
      # only the pointer to it is stale.
      - name: Update release.json
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/arranger-module.tar.gz"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -f "$DEFAULT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cat > release.json << EOF
          {
            "version": "${VERSION}",
            "download_url": "${URL}"
          }
          EOF

          git add release.json
          git commit -m "chore: update release.json for ${GITHUB_REF_NAME}" || echo "No changes"
          # One retry covers the branch moving under us; branch protection
          # (GH006) is what the error below is for.
          if ! git push origin "$DEFAULT_BRANCH"; then
            if ! { git pull --rebase origin "$DEFAULT_BRANCH" && git push origin "$DEFAULT_BRANCH"; }; then
              echo "::error title=release.json not updated::${GITHUB_REF_NAME} is published, but release.json on ${DEFAULT_BRANCH} still names the previous version, so Schwung Manager will not offer it. Commit release.json with version ${VERSION} and download_url ${URL} to ${DEFAULT_BRANCH}."
              exit 1
            fi
          fi
